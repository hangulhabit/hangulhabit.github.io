<title>Hangul Habit — Sign in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #12172a; --bg-raised: #1a2140; --ink: #f3ede1; --ink-dim: #b9c0d6;
    --ink-faint: #7c85a3; --coral: #ff6b5b; --jade: #2fa88a; --gold: #d4a94a;
    --line: rgba(243,237,225,0.12);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="light"]) {
      --bg: #faf6ee; --bg-raised: #ffffff; --ink: #1c1a14; --ink-dim: #514c3e;
      --ink-faint: #8b8574; --coral: #e14f3e; --jade: #1f7d64; --gold: #a9781e;
      --line: rgba(28,26,20,0.12);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12172a; --bg-raised: #1a2140; --ink: #f3ede1; --ink-dim: #b9c0d6;
    --ink-faint: #7c85a3; --coral: #ff6b5b; --jade: #2fa88a; --gold: #d4a94a;
    --line: rgba(243,237,225,0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: "Work Sans", system-ui, sans-serif; line-height: 1.55;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    max-width: 400px; width: 100%; text-align: center;
    background: var(--bg-raised); border: 1px solid var(--line);
    border-radius: 20px; padding: 40px 32px;
  }
  .obang-dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; }
  .obang-dots span { width: 10px; height: 10px; border-radius: 50%; }
  .obang-dots span:nth-child(1) { background: #1a3b6e; }
  .obang-dots span:nth-child(2) { background: #c62b2b; }
  .obang-dots span:nth-child(3) { background: #d9b64e; }
  .obang-dots span:nth-child(4) { background: #e7e2d3; border: 1px solid var(--line); }
  .obang-dots span:nth-child(5) { background: #1a1a1a; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p.lede { color: var(--ink-dim); font-size: 14.5px; margin: 0 0 28px; }

  .oauth-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 13px 20px; border-radius: 12px; font-size: 15px; font-weight: 600;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    cursor: pointer; margin-bottom: 12px; transition: transform 0.1s ease, filter 0.1s ease;
  }
  .oauth-btn:hover { filter: brightness(1.08); }
  .oauth-btn:active { transform: scale(0.98); }
  .oauth-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .oauth-btn.google { background: #fff; color: #1c1a14; }
  .oauth-btn.facebook { background: #1877f2; color: #fff; border-color: transparent; }

  .divider { display: flex; align-items: center; gap: 12px; margin: 22px 0; color: var(--ink-faint); font-size: 13px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .status { margin-top: 18px; font-size: 13px; color: var(--ink-faint); min-height: 18px; }
  .status.error { color: var(--coral); }

  .fine { margin-top: 24px; font-size: 12.5px; color: var(--ink-faint); }
  .fine a { color: var(--gold); }
</style>

<div class="card">
  <div class="obang-dots" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  <h1>Welcome to Hangul Habit</h1>
  <p class="lede">Sign in with Google or Facebook — a new account is created automatically the first time.</p>

  <button class="oauth-btn google" id="btnGoogle" type="button">
    <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.5 13.2l7.8 6.1C12.2 13.1 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.6c-.5 2.9-2.2 5.4-4.6 7.1l7.4 5.7c4.3-4 6.8-9.9 6.8-17.3z"/><path fill="#FBBC05" d="M10.3 19.3a14.5 14.5 0 0 0 0 9.4l-7.8 6.1a24 24 0 0 1 0-21.6l7.8 6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.6-2 15.4-5.6l-7.4-5.7c-2.1 1.4-4.8 2.3-8 2.3-6.4 0-11.8-3.6-13.7-9.7l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
    Continue with Google
  </button>

  <button class="oauth-btn facebook" id="btnFacebook" type="button">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg>
    Continue with Facebook
  </button>

  <p class="status" id="status"></p>
  <p class="fine">By continuing you agree this is an early pilot — see the <a href="index.html">details on the main page</a>.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  // TODO: 실제 Supabase 프로젝트 값으로 교체 (Project Settings > API)
  // anon/public 키는 공개돼도 안전한 키입니다 (RLS로 보호되는 게 원칙) — service_role 키는 절대 여기 넣지 마세요.
  const SUPABASE_URL = "https://czaydegitctvkskpvoaa.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6YXlkZWdpdGN0dmtza3B2b2FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NzI5OTEsImV4cCI6MjEwNDI0ODk5MX0.lssrDd1lBKnx71YuwrFa_Umci1H_U5u4V1Rni3YUD_w";

  const statusEl = document.getElementById("status");
  const configured = !SUPABASE_URL.startsWith("REPLACE_") && !SUPABASE_ANON_KEY.startsWith("REPLACE_");

  if (!configured) {
    statusEl.textContent = "Not connected yet — Supabase URL/key still need to be filled in.";
    statusEl.classList.add("error");
    document.querySelectorAll(".oauth-btn").forEach((b) => (b.disabled = true));
  } else {
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function signIn(provider) {
      statusEl.classList.remove("error");
      statusEl.textContent = "Redirecting to " + provider + "...";
      const { error } = await client.auth.signInWithOAuth({
        provider,
        options: { redirectTo: window.location.origin + window.location.pathname.replace(/[^/]*$/, "") + "account.html" },
      });
      if (error) {
        statusEl.textContent = error.message;
        statusEl.classList.add("error");
      }
    }

    document.getElementById("btnGoogle").addEventListener("click", () => signIn("google"));
    document.getElementById("btnFacebook").addEventListener("click", () => signIn("facebook"));
  }
</script>
